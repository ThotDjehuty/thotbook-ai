[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thotbook-ai"
version = "0.2.0"
description = "Thin Python connectors for the thotbook-ai Rust pipeline (lakehouse, tokenization, local chat)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
keywords = ["llm", "lakehouse", "polars", "arrow", "tokenizer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "polars",
    "pyarrow",
    "requests",
    "tokenizers",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thotbook_ai*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live llm-serve instance",
]
