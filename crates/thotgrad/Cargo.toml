[package]
name = "thotgrad"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Railway-style reverse-mode autodiff and optimisers in Rust, with PyO3 bindings (thotgrad + thotopt)"
repository = "https://github.com/ThotDjehuty/thotbook-ai"

[lib]
name = "thotgrad_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.15"
rand = "0.8"
rand_distr = "0.4"
thiserror = { workspace = true }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.21", optional = true }

[features]
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dev-dependencies]
approx = "0.5"
