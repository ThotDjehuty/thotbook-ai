[workspace]
resolver = "2"
members = [
    "crates/llm-auto",
    "crates/llm-corpus",
    "crates/llm-tokenize",
    "crates/llm-train",
    "crates/llm-rag",
    "crates/llm-serve",
    "crates/llm-cli",
    "crates/llm-ingest",
    "crates/llm-salviers",
    "crates/thotgrad",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ureq = { version = "2", features = ["json"] }
polarway-lakehouse = { path = "../polarway/polarway-lakehouse" }
# Loss/objective primitives: optimiz-rs is the single source of truth for
# every objective this pipeline minimises (see crates/llm-train/src/loss.rs).
optimizr = { package = "optimiz-rs", path = "../optimiz-rs", default-features = false }
deltalake = { version = "0.30", features = ["datafusion"] }
arrow = "57"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled"] }
fancy-regex = "0.18"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
tokenizers = "0.21"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
quick-xml = "0.37"
scraper = "0.23"
walkdir = "2"
